    <style>
        .rpt-header { text-align: center; padding: var(--space-4) 0; }
        .rpt-header h2 { font-size: var(--font-size-heading); font-weight: 800; letter-spacing: -0.02em; }
        .rpt-header .date { font-size: var(--font-size-caption); color: var(--text-secondary); }
        .rpt-header .scope { font-size: var(--font-size-body); color: var(--text-secondary); margin-top: var(--space-1); }

        .rpt-gpa {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-5);
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 1.5rem;
            padding: var(--space-4) var(--space-5);
            margin-bottom: var(--space-4);
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        .rpt-gpa .letter {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1;
            width: 5rem;
            text-align: center;
        }
        .rpt-gpa .info { text-align: left; }
        .rpt-gpa .info .score { font-size: 1.8rem; font-weight: 700; }
        .rpt-gpa .info .label { font-size: var(--font-size-caption); color: var(--text-secondary); }

        .rpt-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 0.5rem;
        }
        .rpt-table thead th {
            font-size: var(--font-size-caption);
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: var(--space-2) var(--space-3);
            border-bottom: 1px solid var(--border-color);
        }
        .rpt-table tbody tr {
            background: var(--bg-tertiary);
            border-radius: 0.75rem;
            transition: background .15s ease;
        }
        .rpt-table tbody tr:hover { background: var(--bg-secondary); }
        .rpt-table tbody td {
            padding: var(--space-3);
            font-size: var(--font-size-body);
            vertical-align: middle;
        }
        .rpt-table tbody td:first-child {
            border-top-left-radius: 0.75rem;
            border-bottom-left-radius: 0.75rem;
        }
        .rpt-table tbody td:last-child {
            border-top-right-radius: 0.75rem;
            border-bottom-right-radius: 0.75rem;
        }

        .rpt-subject-icon {
            width: 2rem;
            text-align: center;
            display: inline-block;
            margin-right: var(--space-2);
        }
        .rpt-grade-cell {
            font-size: 1.5rem;
            font-weight: 800;
            width: 3.5rem;
            text-align: center;
        }
        .rpt-comment {
            color: var(--text-secondary);
            font-size: var(--font-size-caption);
            max-width: 300px;
        }
        .rpt-status-badge {
            display: inline-block;
            padding: 0.2rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
        }
        .rpt-status-badge.excellent { background: var(--bg-success); color: var(--color-green); }
        .rpt-status-badge.good      { background: var(--bg-info); color: var(--color-blue); }
        .rpt-status-badge.fair      { background: var(--bg-warning); color: var(--color-yellow); }
        .rpt-status-badge.poor      { background: var(--bg-danger); color: var(--color-red); }

        .rpt-footer-note {
            text-align: center;
            padding: var(--space-4);
            margin-top: var(--space-4);
            font-size: var(--font-size-caption);
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
        }

        .rpt-selector-wrap { max-width: 400px; margin: 0 auto var(--space-3); }
        .rpt-loading { text-align: center; padding: var(--space-6); color: var(--text-secondary); }

        .rpt-gpa .letter.grade-a { color: var(--color-green); }
        .rpt-gpa .letter.grade-b { color: var(--color-blue); }
        .rpt-gpa .letter.grade-c { color: var(--color-yellow); }
        .rpt-gpa .letter.grade-d { color: var(--color-dirty-yellow); }
        .rpt-gpa .letter.grade-f { color: var(--color-red); }
        .rpt-grade-cell.grade-a { color: var(--color-green); }
        .rpt-grade-cell.grade-b { color: var(--color-blue); }
        .rpt-grade-cell.grade-c { color: var(--color-yellow); }
        .rpt-grade-cell.grade-d { color: var(--color-dirty-yellow); }
        .rpt-grade-cell.grade-f { color: var(--color-red); }
        .rpt-grade-cell.grade-none { color: var(--text-secondary); }
    </style>
</head>

    <style>
        .snap-page {
            min-height: calc(100vh - 200px);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .snap-header {
            text-align: center;
            margin-bottom: var(--space-5);
        }
        .snap-header h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: var(--space-1);
        }
        .snap-header .tagline {
            font-size: var(--font-size-caption);
            color: var(--text-secondary);
        }

        .snap-verdict {
            text-align: center;
            margin-bottom: var(--space-5);
            padding-bottom: var(--space-4);
            border-bottom: 1px solid var(--border-color);
        }
        .snap-verdict .grade-big {
            font-size: 4.5rem;
            font-weight: 800;
            line-height: 1;
        }
        .snap-verdict .grade-big.grade-a { color: var(--color-green); }
        .snap-verdict .grade-big.grade-b { color: var(--color-blue); }
        .snap-verdict .grade-big.grade-c { color: var(--color-yellow); }
        .snap-verdict .grade-big.grade-d { color: var(--color-dirty-yellow); }
        .snap-verdict .grade-big.grade-f { color: var(--color-red); }
        .snap-verdict .score-text {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-top: var(--space-1);
        }
        .snap-verdict .summary-line {
            font-size: 1rem;
            font-weight: 600;
            margin-top: var(--space-2);
        }

        .snap-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-3);
            max-width: 720px;
            margin: 0 auto;
        }
        .snap-metric {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            padding: var(--space-3) var(--space-2);
            text-align: center;
            transition: transform .15s ease;
        }
        .snap-metric:hover { transform: translateY(-2px); }
        .snap-metric .value {
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1.2;
        }
        .snap-metric .label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: var(--space-1);
        }
        .snap-metric .icon {
            font-size: 1.2rem;
            margin-bottom: var(--space-1);
        }
        .snap-metric.good { border-left: 4px solid var(--color-green); }
        .snap-metric.warn { border-left: 4px solid var(--color-yellow); }
        .snap-metric.bad  { border-left: 4px solid var(--color-red); }
        .snap-metric.neutral { border-left: 4px solid var(--text-secondary); }

        .snap-concerns {
            max-width: 720px;
            margin: var(--space-4) auto 0;
            text-align: center;
        }
        .snap-concerns .heading {
            font-size: var(--font-size-caption);
            color: var(--text-secondary);
            margin-bottom: var(--space-2);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .snap-concerns .list {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-2);
            justify-content: center;
        }
        .snap-concerns .item {
            background: var(--bg-danger);
            color: var(--color-red);
            font-size: 0.75rem;
            padding: 0.3rem 0.75rem;
            border-radius: 1rem;
            font-weight: 600;
            border: 1px solid transparent;
        }
        .snap-concerns .all-clear {
            font-size: 0.85rem;
            color: var(--color-green);
            font-weight: 600;
        }

        .snap-selector-wrap { max-width: 300px; margin: 0 auto var(--space-4); }
        .snap-loading { text-align: center; padding: var(--space-6); color: var(--text-secondary); }

        @media (max-width: 576px) {
            .snap-metrics { grid-template-columns: repeat(2, 1fr); }
            .snap-verdict .grade-big { font-size: 3.5rem; }
            .snap-metric .value { font-size: 1.4rem; }
        }
    </style>
</head>

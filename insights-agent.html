    <style>
        .ag-layout { display: flex; flex-direction: column; height: calc(100vh - 250px); min-height: 500px; max-width: 860px; margin: 0 auto; }
        .ag-header { text-align: center; flex-shrink: 0; padding: var(--space-2) 0; }
        .ag-header h2 { font-size: var(--font-size-heading); font-weight: 700; }
        .ag-header .sub { font-size: var(--font-size-caption); color: var(--text-secondary); }
        .ag-status { display: flex; align-items: center; justify-content: center; gap: var(--space-2); font-size: 0.75rem; flex-shrink: 0; }
        .ag-status .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
        .ag-status .dot.ready { background: var(--color-green); }
        .ag-status .dot.unsupported { background: var(--color-red); }
        .ag-status .dot.loading { background: var(--color-yellow); animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.3; } }
        .ag-toolbar { display: flex; gap: var(--space-2); align-items: center; flex-shrink: 0; margin-bottom: var(--space-2); }
        .ag-toolbar select { flex: 1; }
        .ag-toolbar .btn-new { white-space: nowrap; font-size: var(--font-size-caption); }
        .ag-metrics { display: flex; gap: var(--space-2); flex-wrap: wrap; flex-shrink: 0; margin-bottom: var(--space-3); }
        .ag-metric { background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: 0.5rem; padding: var(--space-1) var(--space-3); font-size: 0.75rem; text-align: center; flex: 1; min-width: 70px; }
        .ag-metric .v { font-weight: 800; font-size: 1rem; }
        .ag-metric .l { font-size: 0.6rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; }
        .ag-messages { flex: 1; overflow-y: auto; padding: var(--space-3) var(--space-2); margin: 0 calc(-1 * var(--space-2)); scroll-behavior: smooth; }
        .ag-messages::-webkit-scrollbar { width: 6px; }
        .ag-messages::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        .ag-msg { display: flex; gap: var(--space-3); margin-bottom: var(--space-4); animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .ag-msg .avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 0.9rem; margin-top: 0.15rem; }
        .ag-msg.user { flex-direction: row-reverse; }
        .ag-msg.user .avatar { background: var(--color-blue); color: #fff; }
        .ag-msg.assistant .avatar { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color); }
        .ag-msg.tool-call .avatar { background: var(--bg-warning); color: var(--color-yellow); font-size: 0.8rem; }
        .ag-msg .bubble { max-width: 80%; padding: var(--space-3) var(--space-4); border-radius: 1.2rem; font-size: var(--font-size-body); line-height: 1.7; word-wrap: break-word; }
        .ag-msg.user .bubble { background: var(--color-blue); color: #fff; border-bottom-right-radius: 0.3rem; }
        .ag-msg.assistant .bubble { background: var(--bg-tertiary); border: 1px solid var(--border-color); border-bottom-left-radius: 0.3rem; }
        .ag-msg.tool-call .bubble { background: var(--bg-tertiary); border: 1px dashed var(--color-yellow); border-bottom-left-radius: 0.3rem; font-size: var(--font-size-caption); max-width: 90%; }
        .ag-msg .bubble p { margin-bottom: var(--space-2); }
        .ag-msg .bubble p:last-child { margin-bottom: 0; }
        .ag-msg .bubble ul { padding-left: var(--space-4); margin-bottom: var(--space-2); }
        .ag-msg .bubble li { margin-bottom: var(--space-1); }
        .ag-msg .bubble strong { font-weight: 700; }
        .ag-msg .bubble code { background: rgba(255,255,255,0.1); padding: 0.1rem 0.4rem; border-radius: 0.3rem; font-size: 0.85em; }
        .ag-cursor { display: inline-block; width: 2px; height: 1em; background: var(--color-blue); margin-left: 2px; animation: blink 0.8s step-end infinite; vertical-align: text-bottom; }
        @keyframes blink { 50% { opacity: 0; } }
        .ag-tool-chip { display: inline-block; font-size: 0.65rem; background: var(--bg-warning); color: var(--color-yellow); padding: 0.1rem 0.6rem; border-radius: 0.4rem; margin-right: var(--space-1); font-weight: 600; }
        .ag-query-log { display: block; font-size: 0.7rem; color: var(--text-secondary); margin-top: var(--space-1); font-family: monospace; }
        .ag-suggestions { display: flex; flex-wrap: wrap; gap: var(--space-2); justify-content: center; flex-shrink: 0; margin-bottom: var(--space-2); }
        .ag-suggestion { background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: 2rem; padding: var(--space-1) var(--space-3); font-size: 0.75rem; cursor: pointer; transition: all .15s ease; color: var(--text-secondary); }
        .ag-suggestion:hover { border-color: var(--color-blue); color: var(--color-blue); background: var(--bg-info); }
        .ag-input-wrap { display: flex; gap: var(--space-2); flex-shrink: 0; padding-top: var(--space-2); border-top: 1px solid var(--border-color); }
        .ag-input-wrap input { flex: 1; background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: 2rem; padding: var(--space-2) var(--space-4); color: var(--text-primary); font-size: var(--font-size-body); outline: none; transition: border-color .15s ease; }
        .ag-input-wrap input:focus { border-color: var(--color-blue); }
        .ag-input-wrap input::placeholder { color: var(--text-secondary); }
        .ag-input-wrap input:disabled { opacity: 0.4; }
        .ag-input-wrap button { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--color-blue); color: #fff; font-size: 1.1rem; cursor: pointer; transition: all .15s ease; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .ag-input-wrap button:hover { opacity: 0.85; }
        .ag-input-wrap button:disabled { opacity: 0.3; cursor: not-allowed; }
        .ag-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-secondary); text-align: center; padding: var(--space-4); }
        .ag-empty .icon { font-size: 3rem; margin-bottom: var(--space-3); opacity: 0.3; }
        .ag-empty h5 { font-weight: 600; margin-bottom: var(--space-1); color: var(--text-primary); }
        .ag-empty p { font-size: var(--font-size-caption); max-width: 360px; }
        .ag-unavailable { text-align: center; padding: var(--space-6); max-width: 500px; margin: var(--space-6) auto; }
        .ag-unavailable .icon { font-size: 3rem; margin-bottom: var(--space-3); opacity: 0.5; }
        .ag-cap-badge { display: inline-block; font-size: 0.65rem; background: var(--bg-info); color: var(--color-blue); padding: 0.15rem 0.5rem; border-radius: 0.3rem; margin-left: 0.3rem; }
        @media (max-width: 576px) { .ag-layout { height: calc(100vh - 200px); min-height: 400px; } .ag-metrics { gap: var(--space-1); } .ag-metric { padding: var(--space-1) var(--space-2); min-width: 50px; } .ag-metric .v { font-size: 0.85rem; } .ag-msg .bubble { max-width: 90%; } }
